<div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="lightbox__bar">
    <span class="lightbox__count">1 / 1</span>
    <button class="lb-btn lb-close" type="button" data-lb="close">Close</button>
  </div>
  <div class="lightbox__stage"><img src="" alt=""></div>
  <div class="lightbox__foot">
    <button class="lb-btn" type="button" data-lb="prev" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <span class="lightbox__caption"></span>
    <button class="lb-btn" type="button" data-lb="next" aria-label="Next photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
</div>
